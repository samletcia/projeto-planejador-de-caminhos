name: Teste de leitura

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-leitura:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Planejador

    steps:
      - name: Obter arquivos do repositorio
        uses: actions/checkout@v5

      - name: Compilar teste e programa principal
        run: |
          mkdir -p build

          g++ -std=c++11 -Wall -Wextra -Wpedantic \
            planejador.cpp teste.cpp \
            -o build/teste-leitura

          g++ -std=c++11 -Wall -Wextra -Wpedantic \
            planejador.cpp planejador-main.cpp \
            -o build/planejador

      - name: Executar e verificar testes de leitura
        run: |
          ./build/teste-leitura 2>&1 | tee build/resultado-leitura.txt

          if grep -q 'ERRO' build/resultado-leitura.txt; then
            echo "O teste do professor relatou uma falha."
            exit 1
          fi

          grep -q 'OK! Arquivos base lidos' build/resultado-leitura.txt

          test "$(grep -c 'OK! Mesmos pontos e rotas' build/resultado-leitura.txt)" -eq 2

          test "$(grep -c 'OK (detectou erro e nao alterou conteudo)' build/resultado-leitura.txt)" -eq 48

          echo "Todos os casos esperados do teste de leitura passaram."

      - name: Compilar teste de caminhos
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic \
            planejador.cpp teste-caminhos.cpp \
            -o build/teste-caminhos

      - name: Executar teste de caminhos
        run: ./build/teste-caminhos

      - name: Compilar teste de formato
        run: |
          g++ -std=c++11 -Wall -Wextra -Wpedantic \
            planejador.cpp teste-formato.cpp \
            -o build/teste-formato

      - name: Executar teste de formato
        run: ./build/teste-formato
      - name: Testar aplicativo com o mapa real
        run: |
          printf '3\n#1\n#18\n3\n#1\n#0\n0\n' \
            | timeout 15s ./build/planejador \
            | tee build/resultado-aplicativo.txt

          grep -Fq 'TOTAL: 381.4km' build/resultado-aplicativo.txt
          grep -Fq 'TOTAL: -1km' build/resultado-aplicativo.txt
          grep -Fq 'Nenhum caminho foi encontrado' build/resultado-aplicativo.txt

          echo "OK: aplicativo validado nos dois casos do mapa real."

      - name: Executar os 15 caminhos da avaliacao
        run: |
          origens=(
            "#1" "#5" "#9" "#13" "#17"
            "#22" "#42" "#72" "#95" "#6"
            "#16" "#2" "#0" "#12" "#0"
          )

          destinos=(
            "#3" "#7" "#11" "#15" "#19"
            "#28" "#61" "#88" "#143" "#4"
            "#18" "#14" "#10" "#0" "#0"
          )

          : > build/resultado-avaliacao.txt

          for i in "${!origens[@]}"; do
            {
              printf '\nCAMINHO 2.%d\n' "$((i + 1))"
              printf 'Origem utilizada: %s\n' "${origens[$i]}"
              printf 'Destino utilizado: %s\n' "${destinos[$i]}"

              printf '3\n%s\n%s\n0\n' \
                "${origens[$i]}" "${destinos[$i]}" \
                | timeout 15s ./build/planejador
            } 2>&1 | tee -a build/resultado-avaliacao.txt
          done

          test "$(grep -c 'TOTAL:' build/resultado-avaliacao.txt)" -eq 15

          if grep -q 'Erro no algoritmo' build/resultado-avaliacao.txt; then
            echo "O aplicativo relatou erro no calculo."
            exit 1
          fi

      - name: Disponibilizar resultados da avaliacao
        uses: actions/upload-artifact@v7
        with:
          name: resultados-avaliacao
          if-no-files-found: error
          path: |
            Planejador/build/resultado-leitura.txt
            Planejador/build/resultado-avaliacao.txt
            Planejador/planejador.h
            Planejador/planejador.cpp